<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>앱 설치 목록</title><style>body{margin:0;background:#10231f;color:#eaf3f0;font:15px/1.6 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:24px 16px}h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 10px;color:#9fb7b0}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:420px}.t{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px}.t img{width:62px;border-radius:24%}p{color:#9fb7b0;font-size:13px;max-width:420px}</style></head><body><h1>앱 설치 목록</h1><p>아이콘을 누르면 그 앱의 설치 화면이 열립니다. 앱마다 한 번씩 설치(또는 바로가기)하세요. Chrome 앱에서 여세요.</p><h2>개인</h2><div class="g"><a class="t" href="ga.html"><img src="ga-192.png?v=2" alt=""><span>가계부</span></a><a class="t" href="as.html"><img src="as-192.png?v=2" alt=""><span>자산</span></a><a class="t" href="dt.html"><img src="dt-192.png?v=2" alt=""><span>단기투자</span></a><a class="t" href="jr.html"><img src="jr-192.png?v=2" alt=""><span>진료일지</span></a><a class="t" href="b3.html"><img src="b3-192.png?v=2" alt=""><span>북아현3</span></a><a class="t" href="pa.html"><img src="pa-192.png?v=2" alt=""><span>개인비서</span></a><a class="t" href="golf.html"><img src="golf-192.png?v=2" alt=""><span>골프</span></a></div><h2>법인 (개인 설치 링크로만 설치)</h2><div class="g"><a class="t" href="smk.html"><img src="smk-192.png?v=2" alt=""><span>SM관리</span></a><a class="t" href="smf.html"><img src="smf-192.png?v=2" alt=""><span>SM재무</span></a><a class="t" href="sq.html"><img src="sq-192.png?v=2" alt=""><span>오징어</span></a><a class="t" href="hnc.html"><img src="hnc-192.png?v=2" alt=""><span>HNC</span></a></div><p>법인 앱 주소는 공개 페이지에 두지 않습니다. 대장에 적힌 개인 설치 링크를 휴대폰에서 한 번 열면 그 휴대폰에만 저장됩니다.</p></body></html>
